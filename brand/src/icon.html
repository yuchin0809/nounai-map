<!doctype html>
<!-- プロフィール用アイコン。800x800で画面キャプチャして ../icon.png に保存する -->
<html lang="ja"><head><meta charset="utf-8">
<style>html,body{margin:0}body{width:800px;height:800px;overflow:hidden}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- コントローラー本体(影) -->
  <g transform="translate(0 14)" fill="#c98f12" opacity=".55">
    <rect x="130" y="270" width="540" height="230" rx="115"/>
    <circle cx="225" cy="480" r="105"/><circle cx="575" cy="480" r="105"/>
  </g>
  <!-- コントローラー本体 -->
  <g fill="#1d2433">
    <rect x="130" y="270" width="540" height="230" rx="115"/>
    <circle cx="225" cy="480" r="105"/><circle cx="575" cy="480" r="105"/>
  </g>
  <!-- 十字キー -->
  <g fill="#ffffff">
    <rect x="195" y="355" width="130" height="42" rx="10"/>
    <rect x="239" y="311" width="42" height="130" rx="10"/>
  </g>
  <!-- ボタン: 赤と青 = 2人 -->
  <circle cx="548" cy="418" r="40" fill="#e8503a"/>
  <circle cx="618" cy="358" r="40" fill="#4f86f7"/>
</svg>
</body></html>
