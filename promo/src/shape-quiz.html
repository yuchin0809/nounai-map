<!doctype html>
<!-- 県の形クイズの画像(1080x1350)。画面キャプチャして保存する。
  ?pref=<県番号>&mode=draw-prompt|draw-answer|sil-prompt|sil-answer[&theme=halloween][&fact=豆知識]
  draw-*: 「◯◯県の形、描ける?」型 / sil-*: 「この形、何県?」型 -->
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{--bg:#f7f1e3;--ink:#1d2433;--sub:#5d6577;--frame:#fffdf6;--line:#d9d0ba;--chip:#e8503a;--chipink:#fff;--tag:#8a8268;--shape:#1d2433;--shapeline:#1d2433;--ans:#38a89d}
  body.halloween{--bg:#1b1030;--ink:#ffe3b3;--sub:#c9b4e8;--frame:#2a1848;--line:#4a2f7a;--chip:#ff8a1f;--chipink:#1b1030;--tag:#9d86c8;--shape:#ff8a1f;--shapeline:#ffd9a0;--ans:#ff8a1f}
  html,body{margin:0}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
  .chip{position:absolute;left:100px;top:70px;padding:10px 28px;border:4px solid var(--ink);border-radius:999px;background:var(--chip);color:var(--chipink);font-size:38px;font-weight:800}
  h1{position:absolute;left:100px;top:176px;margin:0;font-size:106px;line-height:1.2;font-weight:900;letter-spacing:.02em}
  .frame{position:absolute;left:100px;top:470px;width:880px;height:640px;box-sizing:border-box;border:6px solid var(--line);border-radius:28px;background:var(--frame);overflow:hidden}
  .frame svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{position:absolute;left:100px;top:1130px;width:880px;margin:0;font-size:52px;font-weight:800;line-height:1.4}
  .cap small{display:block;margin-top:6px;font-size:36px;font-weight:600;color:var(--sub)}
  .tag{position:absolute;right:100px;bottom:26px;font-size:28px;font-weight:700;color:var(--tag)}
</style></head><body>
<div class="chip" id="chip"></div>
<h1 id="title"></h1>
<div class="frame" id="frame"></div>
<p class="cap" id="cap"></p>
<div class="tag">脳内日本地図 公開中</div>
<script src="../../js/data.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const id = Number(q.get('pref') || 3), mode = q.get('mode') || 'draw-prompt', fact = q.get('fact') || '';
  if (q.get('theme') === 'halloween') document.body.classList.add('halloween');
  const M = window.MAP, p = M.prefs.find((x) => x.id === id), name = p.name;
  const $ = (s) => document.getElementById(s);

  const TEXT = {
    'draw-prompt': { chip: 'お題', title: `${name}の形、<br>描ける?`, cap: '記憶だけで、指で描いてみて。', small: '描けたら、画像で返信してね' },
    'draw-answer': { chip: '答え合わせ', title: `${name}は、<br>こんな形でした`, cap: fact || 'あなたの絵は、近かった?', small: '次に出してほしい県を、返信で教えてね' },
    'sil-prompt': { chip: '今日の県', title: 'この形、<br>何県?', cap: '分かったら、返信で答えてね。', small: '答えは、今夜この投稿に返信するよ' },
    'sil-answer': { chip: '答え', title: `正解は、<br>${name}!`, cap: fact || '合ってた?', small: '明日の県もお楽しみに' },
  }[mode];
  $('chip').textContent = TEXT.chip;
  $('title').innerHTML = TEXT.title;
  $('cap').innerHTML = TEXT.cap + (TEXT.small ? `<small>${TEXT.small}</small>` : '');

  if (mode !== 'draw-prompt') {
    // 地図は、全体で1つの緯度(中央)の補正で横幅を決めている。この県の緯度で、横のゆがみを直す
    const K = 111.2 / M.kmPerUnit, LAT_MAX = 45.557, PAD = 24, LAT0 = 34.906;
    const lat = LAT_MAX - (p.cy - PAD) / K;
    const sx = Math.cos(lat * Math.PI / 180) / Math.cos(LAT0 * Math.PI / 180);
    const w = p.bw * sx, h = p.bh, pad = 70;
    const sc = Math.min((880 - pad * 2) / w, (640 - pad * 2) / h);
    const sil = mode === 'sil-prompt';
    const fill = sil ? 'var(--shape)' : 'var(--ans)';
    const line = sil ? 'var(--shapeline)' : (document.body.classList.contains('halloween') ? 'var(--shapeline)' : '#1d2433');
    $('frame').innerHTML = `<svg viewBox="0 0 880 640" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(${440 - (p.cx * sx) * sc} ${320 - p.cy * sc}) scale(${sx * sc} ${sc})">
        <path d="${p.d}" fill="${fill}" fill-opacity="${sil ? 1 : .92}" stroke="${line}" stroke-width="${3 / sc}" stroke-linejoin="round" fill-rule="evenodd"/>
      </g></svg>`;
  }
</script>
</body></html>
