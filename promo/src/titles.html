<!doctype html>
<!-- 称号一覧の画像(1080x1350)。js/app.js の RANKS を読んで並べる。画面キャプチャして保存する -->
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#f7f1e3;color:#1d2433;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
  .chip{position:absolute;left:100px;top:64px;padding:10px 28px;border:4px solid #1d2433;border-radius:999px;background:#e8503a;color:#fff;font-size:36px;font-weight:800}
  h1{position:absolute;left:100px;top:140px;margin:0;font-size:80px;line-height:1.2;font-weight:900}
  ol{position:absolute;left:100px;top:290px;width:880px;margin:0;padding:0;list-style:none}
  li{display:flex;align-items:center;gap:20px;height:50px;margin-bottom:5px;padding:0 22px;border-radius:12px;background:#fffdf6;border:3px solid #d9d0ba;font-size:31px;font-weight:700}
  li b{min-width:120px;font-size:27px;color:#e8503a;font-variant-numeric:tabular-nums}
  li.top{background:#1d2433;color:#fff;border-color:#1d2433}
  li.top b{color:#ffc83d}
  .cap{position:absolute;left:100px;top:1228px;margin:0;font-size:40px;font-weight:800}
  .tag{position:absolute;right:100px;bottom:26px;font-size:28px;font-weight:700;color:#8a8268}
</style></head><body>
<div class="chip">称号</div>
<h1>称号は、全部で15段階</h1>
<ol id="list"></ol>
<p class="cap">あなたは、どこまで行ける?</p>
<div class="tag">脳内日本地図 公開中</div>
<script>
  fetch('../../js/app.js').then((r) => r.text()).then((src) => {
    const m = src.match(/const RANKS = (\[[\s\S]*?\n  \]);/);
    const ranks = eval(m[1]);
    document.getElementById('list').innerHTML = ranks.map((r, i) =>
      `<li class="${i === 0 ? 'top' : ''}"><b>${r[0] === 0 ? '5点未満' : r[0] + '点〜'}</b>${r[1]}</li>`).join('');
    document.body.dataset.ready = '1';
  });
</script>
</body></html>
