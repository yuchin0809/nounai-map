<!doctype html>
<!-- 開発日記の画像(1080x1350)。loupe-shot.png はゲーム画面のスクリーンショット -->
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#f7f1e3;color:#1d2433;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
  .chip{position:absolute;left:100px;top:70px;padding:10px 28px;border:4px solid #1d2433;border-radius:999px;background:#4f86f7;color:#fff;font-size:38px;font-weight:800}
  h1{position:absolute;left:100px;top:176px;margin:0;font-size:100px;line-height:1.2;font-weight:900}
  .frame{position:absolute;left:100px;top:470px;width:880px;height:640px;box-sizing:border-box;border:6px solid #d9d0ba;border-radius:28px;overflow:hidden;background:#f7f1e3}
  .frame img{width:100%;height:100%;object-fit:contain;background:#f7f1e3}
  .cap{position:absolute;left:100px;top:1130px;width:880px;margin:0;font-size:52px;font-weight:800;line-height:1.4}
  .cap small{display:block;margin-top:6px;font-size:36px;font-weight:600;color:#5d6577}
  .tag{position:absolute;right:100px;bottom:26px;font-size:28px;font-weight:700;color:#8a8268}
</style></head><body>
<div class="chip">開発日記</div>
<h1>県が小さくて、<br>置きづらい…</h1>
<div class="frame"><img src="loupe-crop.png" alt=""></div>
<p class="cap">そこで「ルーペ」を付けました。<small>ドラッグ中だけ、県の周りが大きく見えます</small></p>
<div class="tag">脳内日本地図 公開中</div>
</body></html>
